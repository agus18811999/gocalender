<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ff"><title>Verify your email · Calendra</title><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script defer src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 24% 18%,#ded0ff,transparent 45%),radial-gradient(ellipse at 81% 82%,#ede3ff,transparent 45%),#faf9ff;color:#27164c;font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:20px}button{cursor:pointer;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #a881ef;outline-offset:4px}.shell{width:min(100%,480px)}.logo{text-decoration:none;color:#251349;display:flex;align-items:center;justify-content:center;gap:10px;font:bold 24px 'Plus Jakarta Sans';margin-bottom:28px;letter-spacing:-1.2px}.logo b{background:#7541e7;color:white;width:42px;height:42px;border-radius:14px;display:grid;place-items:center}.card{background:#ffffffde;border:1px solid white;box-shadow:0 24px 95px #5d379520;border-radius:28px;padding:49px 39px;text-align:center;backdrop-filter:blur(16px)}.visual{width:92px;height:92px;margin:auto auto 27px;background:linear-gradient(145deg,#f5efff,#e6d9ff);border:1px solid #dcccf8;border-radius:27px;display:grid;place-items:center;font-size:41px;position:relative}.visual:after{content:'✦';position:absolute;right:-13px;top:-13px;color:#8e63f4;font-size:23px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#9161e8;text-transform:uppercase}h1{font:800 31px/1.2 'Plus Jakarta Sans';letter-spacing:-1.4px;margin:14px 0}p{line-height:1.8;color:#777086;font-size:14px;margin:0 0 24px}#email{font-weight:800;color:#492a83}.notice{border:1px solid #e9e0f9;background:#f8f4ff;border-radius:12px;padding:12px;color:#6e4da5;font-size:12px;margin:0 0 20px;line-height:1.6}.notice.error{background:#fff1f3;color:#b64559;border-color:#ffd9de}.mainbtn,.outline{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin-top:12px;font-weight:800;font-size:13px}.mainbtn{background:linear-gradient(115deg,#8757f2,#6933d9);color:white;box-shadow:0 9px 22px #7441d43a}.outline{background:#fff;border:1px solid #e9e1f2;color:#6844ab}.mainbtn:disabled,.outline:disabled{opacity:.5;cursor:wait}.fine{text-align:center;font-size:11px;color:#9d93ab;margin-top:23px}.loader{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #ddd1f3;border-top-color:#8253e5;animation:spin .65s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:500px){.card{padding:37px 24px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div class="shell"><a class="logo" href="index.html"><b>✦</b> calendra.</a><main class="card"><div class="visual">✉</div><div class="eyebrow">SECURE YOUR SPACE</div><h1>One little step.<br>Big days ahead.</h1><p>Verifikasi email <span id="email">Anda</span> untuk mengaktifkan ruang produktivitas pribadi Anda.</p><div class="notice" id="notice" role="status" aria-live="polite">Sedang memeriksa status verifikasi <span class="loader"></span></div><button class="mainbtn" id="check">I've verified my email →</button><button class="outline" id="resend">Resend verification email</button><button class="outline" id="logout">Use another account</button></main><div class="fine">Your calendar. Your privacy. Your peace of mind.</div></div>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';import{getAuth,onAuthStateChanged,sendEmailVerification,applyActionCode,checkActionCode,signOut,verifyPasswordResetCode}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
const C=window.CALENDRA,el=x=>document.getElementById(x);let auth,user,busy=false;function notice(msg,error=false){el('notice').className='notice'+(error?' error':'');el('notice').textContent=msg;}function setBusy(v){busy=v;el('check').disabled=v;el('resend').disabled=v;}
async function check(){if(!user)return notice('Silakan login terlebih dahulu.',true);try{setBusy(true);await user.reload();if(auth.currentUser?.emailVerified){notice('Email berhasil diverifikasi. Membuka dashboard…');location.replace('main.html');return;}notice('Email belum diverifikasi. Buka tautan terbaru yang dikirim ke inbox Anda.');}catch(e){notice(C.errorMessage(e),true);}finally{setBusy(false);}}
try{if(!C.configured())throw Error('Konfigurasi Firebase belum diatur di config.js');auth=getAuth(getApps().length?getApp():initializeApp(C.CONFIG.FIREBASE_CONFIG));const params=new URLSearchParams(location.search);const mode=params.get('mode'),oobCode=params.get('oobCode');if(mode==='verifyEmail'&&oobCode){try{await checkActionCode(auth,oobCode);await applyActionCode(auth,oobCode);notice('Email berhasil diverifikasi. Memperbarui sesi…');history.replaceState(null,'',location.pathname);}catch(e){notice('Tautan tidak valid atau kedaluwarsa. Minta email verifikasi baru.',true);}}else if(mode==='resetPassword'){location.replace('index.html');}onAuthStateChanged(auth,async u=>{user=u;if(!u){el('email').textContent='Anda';notice('Login terlebih dahulu lalu periksa tautan verifikasi di email Anda.',true);return;}el('email').textContent=u.email||'Anda';if(u.emailVerified){location.replace('main.html');return;}if(!oobCode)notice('Periksa inbox dan spam. Klik tautan yang baru kami kirim, lalu kembali ke sini.');});}catch(e){notice(C.errorMessage(e),true);}
el('check').onclick=check;el('resend').onclick=async()=>{if(busy||!user)return notice('Silakan login terlebih dahulu.',true);try{setBusy(true);await sendEmailVerification(user,{url:new URL('verify.html',location.href).href});notice('Email verifikasi baru dikirim. Periksa inbox atau spam.');}catch(e){notice(C.errorMessage(e),true);}finally{setBusy(false);}};el('logout').onclick=async()=>{try{if(auth)await signOut(auth);}finally{location.replace('index.html');}};
</script></body></html>

<script type="module">

import{getAuth,onAuthStateChanged,signOut,updateProfile,verifyBeforeUpdateEmail,sendEmailVerification}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
const C=window.CALENDRA,el=id=>document.getElementById(id),esc=C.escapeHTML;
const TODAY=()=>new Date(),isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const dtLocal=d=>`${isoDay(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

const NAV=[

  ['PLAN & ORGANIZE',[['meetings','Meetings','video'],['recurring','Recurring Events','repeat-2'],['blocking','Time Blocking','timer'],['reminders','Reminders','alarm-clock'],['scheduling','Smart Scheduling','sparkles']]],
  ['INSIGHTS & TOOLS',[['search','Search & Filters','search'],['analytics','Productivity Insights','chart-no-axes-combined'],['templates','Event Templates','layout-template'],['quickadd','Quick Add','zap'],['transfer','Import & Export','arrow-left-right']]],
  ['PREFERENCES',[['notifications','Activity Center','bell'],['profile','My Profile','user-round'],['settings','Settings','settings-2']]]

const TITLES=Object.fromEntries(NAV.flatMap(g=>g[1].map(x=>[x[0],x[1]])));
const state={auth:null,user:null,view:'overview',calendarView:'month',selected:TODAY(),calendars:[],events:[],token:null,expires:0,scope:new Set(),syncAt:0,busy:false,loadPending:0,fetchEpoch:0,search:'',filterCalendar:'all',settings:{timezone:'Asia/Jakarta',workStart:'09:00',workEnd:'17:00',defaultDuration:60,defaultReminder:15,defaultCalendar:'primary',firstDay:1,goals:''},profile:null,preferences:[],templates:[],categories:[],notifications:[],activity:[],metadata:'loading',bridge:null,cache:new Map(),lastFocused:null,editing:null,importRows:[],syncTimer:null};
const dateStart=e=>new Date(e.start?.dateTime||`${e.start?.date}T00:00:00`),dateEnd=e=>new Date(e.end?.dateTime||`${e.end?.date}T00:00:00`);

const eventColor=e=>e._color||'#9468e8';

const writable=id=>['owner','writer'].includes(state.calendars.find(c=>c.id===id)?.accessRole);
const refreshIcons=()=>{try{window.lucide?.createIcons();}catch{}};
function toast(msg,kind='info'){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;el('toastContainer').append(t);setTimeout(()=>t.remove(),4700);}
function gate(open){el('authGate').hidden=!open;}
function closeSide(){el('sidebar').classList.remove('open');el('overlay').classList.remove('open');}
function menu(){el('sidebar').classList.toggle('open');el('overlay').classList.toggle('open');}
function showModal(title,html,after){state.lastFocused=document.activeElement;el('modalTitle').textContent=title;el('modalBody').innerHTML=html;el('modalLayer').hidden=false;document.body.style.overflow='hidden';refreshIcons();after?.();el('modalBody').querySelector('input,select,textarea,button')?.focus();}

function setConnection(){const on=!!state.token&&state.expires>Date.now();el('connectionLabel').textContent=on?'Google Calendar linked':'Calendar not connected';el('connectionDot').classList.toggle('online',on);el('syncLabel').textContent=on?(state.syncAt?'Synced '+C.fmtTime(state.syncAt):'Ready to sync'):'Connect to sync';}
function profileHeader(){const u=state.user,profile=state.profile;el('sideName').textContent=profile?.name||u?.displayName||u?.email?.split('@')[0]||'My Workspace';const av=el('sideAvatar');av.innerHTML=profile?.photoURL||u?.photoURL?`<img src="${esc(profile?.photoURL||u.photoURL)}" alt="">`:esc((profile?.name||u?.displayName||'C')[0].toUpperCase());}
function navigate(v){if(!TITLES[v])return;state.view=v;el('crumb').textContent=TITLES[v].toUpperCase();el('pageTitle').textContent=TITLES[v];closeSide();renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}
function pageHeading(label,sub='',actions=''){return `<div class="section-top"><div><h3>${label}</h3>${sub?`<p>${sub}</p>`:''}</div><div class="section-actions">${actions}</div></div>`;}
const empty=(msg='Belum ada event pada periode ini.',symbol='✦')=>`<div class="empty"><div class="big">${symbol}</div>${esc(msg)}</div>`;
function needCalendar(){return `<div class="connect-state"><div class="glyph">${icon('calendar-heart')}</div><h3>Your calendar, your canvas.</h3><p>Hubungkan Google Calendar untuk melihat agenda nyata Anda, mengelola event, dan menemukan waktu luang. Tidak ada data simulasi di dashboard ini.</p><button class="btn primary" data-action="connect">${icon('link-2')} Connect Google Calendar</button></div>`;}
function getDateRange(){const d=state.selected;return {min:new Date(d.getFullYear(),d.getMonth()-1,1),max:new Date(d.getFullYear(),d.getMonth()+2,1)};}
function allowedScopes(requested){return requested.every(s=>state.scope.has(s));}
let oauthClient,oauthResolve,oauthReject;
function googleClient(scopes){if(!window.google?.accounts?.oauth2)throw Error('Google Identity Services belum dimuat. Muat ulang halaman.');if(!C.googleConfigured())throw Error('GOOGLE_CLIENT_ID belum diatur di config.js.');return window.google.accounts.oauth2.initTokenClient({client_id:C.CONFIG.GOOGLE_CLIENT_ID,scope:scopes.join(' '),callback:(reply)=>{if(reply?.error){oauthReject?.(Error(reply.error));return;}if(!reply?.access_token){oauthReject?.(Error('Google tidak mengirim access token.'));return;}state.token=reply.access_token;state.expires=Date.now()+((Number(reply.expires_in)||3600)-90)*1000;state.scope=new Set((reply.scope||scopes.join(' ')).split(/\s+/));oauthResolve?.(reply);},error_callback:e=>oauthReject?.(Error(e?.message||'Google OAuth popup ditutup.'))});}
function requestGoogle(scopes=C.CONFIG.CALENDAR_SCOPES){return new Promise((resolve,reject)=>{try{oauthResolve=resolve;oauthReject=reject;const client=googleClient(scopes);client.requestAccessToken({prompt:'consent'});}catch(e){reject(e);}});}
async function connectCalendar(){try{await requestGoogle([...new Set([...C.CONFIG.CALENDAR_SCOPES])]);toast('Google Calendar connected. Loading schedules…','success');setConnection();await syncAll(true);}catch(e){toast(niceError(e),'error');}}
async function requestAdmin(){if(state.scope.has(C.CONFIG.CALENDAR_ADMIN_SCOPE))return;await requestGoogle([...new Set([...state.scope,C.CONFIG.CALENDAR_ADMIN_SCOPE,...C.CONFIG.CALENDAR_SCOPES])]);}
async function api(path,{method='GET',query={},body,signal,retry=0,headers={}}={}){
 if(!state.token||Date.now()>state.expires){state.token=null;setConnection();throw Error('Sesi Google Calendar habis. Klik Connect Google Calendar untuk menghubungkan ulang.');}
 const params=new URLSearchParams();Object.entries(query).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')params.set(k,v);});const url=C.CONFIG.CALENDAR_API_BASE+path+(params.size?'?'+params.toString():'');
 let response;try{response=await fetch(url,{method,headers:{Authorization:'Bearer '+state.token,...(body?{'Content-Type':'application/json'}:{}),...headers},body:body?JSON.stringify(body):undefined,signal});}catch(e){if(e.name==='AbortError')throw e;throw Error('Tidak dapat terhubung ke Google Calendar API. Periksa koneksi internet.');}
 if((response.status===429||response.status>=500)&&retry<2){await C.sleep(450*(retry+1));return api(path,{method,query,body,signal,retry:retry+1,headers});}
 if(response.status===204)return {ok:true};const data=await response.json().catch(()=>({}));
 if(!response.ok){if(response.status===401){state.token=null;setConnection();}const detail=data?.error?.message||response.statusText||'Request failed';throw Error(`Google Calendar ${response.status}: ${detail}`);}

}
let fetchAbort;
async function listAllEvents(cal){const r=getDateRange();let pageToken,items=[],loops=0;do{const data=await api('/calendars/'+encodeURIComponent(cal.id)+'/events',{query:{timeMin:r.min.toISOString(),timeMax:r.max.toISOString(),singleEvents:true,orderBy:'startTime',maxResults:250,pageToken},signal:fetchAbort.signal});items.push(...(data.items||[]).filter(x=>x.status!=='cancelled').map(x=>({...x,_calendarId:cal.id,_color:cal.backgroundColor||'#9468e8',_calendarName:cal.summary||''})));pageToken=data.nextPageToken;loops++;}while(pageToken&&loops<8);return items;}
async function syncAll(resetCals=false){if(!state.token){render();return;}const epoch=++state.fetchEpoch;fetchAbort?.abort();fetchAbort=new AbortController();state.loadPending++;render();try{
 if(resetCals||!state.calendars.length){let pages=[],next,guard=0;do{const data=await api('/users/me/calendarList',{query:{maxResults:200,pageToken:next},signal:fetchAbort.signal});pages.push(...(data.items||[]));next=data.nextPageToken;guard++;}while(next&&guard<10);state.calendars=pages;}
 const all=state.calendars.filter(c=>c.accessRole!=='freeBusyReader');let entries=[];for(let i=0;i<all.length;i+=4){const chunk=all.slice(i,i+4);const results=await Promise.allSettled(chunk.map(listAllEvents));if(epoch!==state.fetchEpoch)return;results.forEach((r,j)=>{if(r.status==='fulfilled')entries.push(...r.value);else toast(`Gagal memuat kalender ${chunk[j].summary}: ${niceError(r.reason)}`,'error');});}
 if(epoch!==state.fetchEpoch)return;state.events=sortEvents(entries);state.syncAt=Date.now();state.cache.clear();setConnection();render();
 }catch(e){if(e.name!=='AbortError')toast(niceError(e),'error');}finally{state.loadPending=Math.max(0,state.loadPending-1);if(epoch===state.fetchEpoch)render();}}
async function afterMutation(message){toast(message,'success');await syncAll(false);}
async function metadata(action,payload={}){if(!state.bridge)throw Error('Backend metadata belum dihubungkan.');const token=await state.user.getIdToken();return state.bridge.call(action,payload,token);}
async function initMetadata(){if(!C.gasConfigured()){state.metadata='missing';render();return;}state.bridge=C.makeMetadataBridge();try{const r=await metadata('system.bootstrap');state.profile=r.profile;state.settings={...state.settings,...r.settings};state.templates=r.templates||[];state.categories=r.categories||[];state.preferences=r.preferences||[];state.metadata='connected';profileHeader();render();}catch(e){state.metadata='unavailable';console.warn('Metadata bridge unavailable:',e.message);render();}}
const backendStatus=()=>state.metadata==='connected'?'<span class="tag success">Metadata synced</span>':'<span class="tag warn">Metadata not connected</span>';
async function metaGuard(task){try{if(state.metadata!=='connected')throw Error('Metadata Apps Script tidak tersedia. Periksa deployment dan izin iframe di browser.');await task();}catch(e){toast(niceError(e),'error');}}
function refreshAfterDate(){if(state.token)syncAll(false);else render();}
function eventListHtml(events,limit=999){if(!events.length)return empty();return events.slice(0,limit).map(e=>`<div class="eventrow" data-open="${esc(e.id)}" data-calid="${esc(e._calendarId)}"><div class="timepill">${esc(eventTime(e))}</div><span class="eventstripe" style="background:${eventColor(e)}"></span><div class="event-info"><div class="event-title">${esc(e.summary||'(Untitled event)')}</div><div class="event-detail">${esc(e._calendarName)} · ${dateLabel(dateStart(e),{day:'numeric',month:'short'})}${e.location?' · '+esc(e.location):''}</div></div>${e.hangoutLink?icon('video'):''}</div>`).join('')+(events.length>limit?`<div class="help">Menampilkan ${limit} dari ${events.length} event.</div>`:'');}
function eventCards(events){if(!events.length)return empty('Tidak ada agenda untuk rentang ini.');return events.map(e=>`<div class="event-card" data-open="${esc(e.id)}" data-calid="${esc(e._calendarId)}"><span class="colorbar" style="background:${eventColor(e)}"></span><div style="min-width:0;flex:1"><h4>${esc(e.summary||'(Untitled event)')}</h4><p>${esc(dateLabel(dateStart(e)))} · ${esc(eventTime(e))} · ${esc(e._calendarName)}${e.attendees?.length?' · '+e.attendees.length+' guests':''}</p></div><span class="tag">${Math.round(eventDuration(e))}m</span></div>`).join('');}
function groupAgenda(events){const grouped=new Map();events.forEach(e=>{const day=isoDay(dateStart(e));if(!grouped.has(day))grouped.set(day,[]);grouped.get(day).push(e);});return [...grouped.entries()].map(([day,list])=>`<div class="dateheading">${dateLabel(new Date(day+'T00:00:00'))}</div>${eventCards(list)}`).join('');}
function filterEvents(){const q=state.search.toLowerCase().trim();return visibleEvents().filter(e=>(state.filterCalendar==='all'||state.filterCalendar===e._calendarId)&&(!q||[e.summary,e.description,e.location,e._calendarName,...(e.attendees||[]).map(a=>a.email||'')].some(s=>String(s||'').toLowerCase().includes(q))));}
function overview(){if(!state.token)return `${pageHeading('Your command center','Satu ruang untuk seluruh rencana Anda.')}${needCalendar()}`;
 const events=visibleEvents(),today=TODAY(),todayId=isoDay(today),todayEvents=events.filter(e=>isoDay(dateStart(e))===todayId),weekStart=startWeek(today),weekEnd=addDays(weekStart,7),weekly=events.filter(e=>dateStart(e)>=weekStart&&dateStart(e)<weekEnd),meetings=weekly.filter(e=>e.attendees?.length||e.hangoutLink),next=events.find(e=>dateEnd(e)>today),dailyMinutes=todayEvents.reduce((sum,e)=>sum+eventDuration(e),0),work=Math.max(0,(Number(state.settings.workEnd.split(':')[0])*60+Number(state.settings.workEnd.split(':')[1]))-(Number(state.settings.workStart.split(':')[0])*60+Number(state.settings.workStart.split(':')[1]))),free=Math.max(0,work-dailyMinutes)/60;
 const week=Array.from({length:7},(_,i)=>{const d=addDays(weekStart,i),items=weekly.filter(e=>isoDay(dateStart(e))===isoDay(d));return `<div class="daycol"><div class="dayhead">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</div><div class="daynum ${isoDay(d)===todayId?'today':''}">${d.getDate()}</div><div class="mini-events">${items.slice(0,3).map(e=>`<button class="mini-event" style="border-color:${eventColor(e)}" data-open="${esc(e.id)}" data-calid="${esc(e._calendarId)}" title="${esc(e.summary||'Event')}">${esc(e.summary||'Event')}</button>`).join('')}${items.length>3?`<div class="help">+${items.length-3}</div>`:''}</div></div>`;}).join('');
 const stats=[['Events today',todayEvents.length,'calendar-check','Agenda hari ini'],['Events this week',weekly.length,'calendar-range','Seluruh kalender aktif'],['Meeting this week',meetings.length,'users-round','Dengan undangan/Meet'],['Free time estimate',free.toFixed(1)+'h','coffee','Jam kerja dikurangi durasi event']];

function monthView(){const d=state.selected,first=firstMonth(d),offset=(first.getDay()+6)%7,start=addDays(first,-offset),events=visibleEvents(),now=isoDay(TODAY());const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<div class="month-grid">${days.map(x=>`<div class="month-head">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const day=addDays(start,i),key=isoDay(day),items=events.filter(e=>dateStart(e)<addDays(day,1)&&dateEnd(e)>day);return `<div class="month-day ${day.getMonth()!==d.getMonth()?'out':''}" data-day="${key}"><span class="daynumber ${key===now?'now':''}">${day.getDate()}</span>${items.slice(0,3).map(e=>`<button class="m-event" style="border-color:${eventColor(e)}" data-open="${esc(e.id)}" data-calid="${esc(e._calendarId)}" title="${esc(e.summary||'Event')}">${esc(e.summary||'Event')}</button>`).join('')}${items.length>3?`<div class="help">+${items.length-3} more</div>`:''}</div>`}).join('')}</div>`;}
function timelineView(days){
 const start=days===7?startWeek(state.selected):new Date(state.selected.getFullYear(),state.selected.getMonth(),state.selected.getDate());
 const now=TODAY(),hours=Array.from({length:24},(_,i)=>`<span class="timelabel" style="top:${i*54+4}px">${String(i).padStart(2,'0')}:00</span>`).join('');
 const headings=Array.from({length:days},(_,i)=>{const d=addDays(start,i);return `<div class="timehead">${dateLabel(d,{weekday:'short',day:'numeric',month:'short'})}</div>`;}).join('');
 const allDay=visibleEvents().filter(e=>e.start?.date&&dateStart(e)<addDays(start,days)&&dateEnd(e)>start);
 const columns=Array.from({length:days},(_,i)=>{
   const d=addDays(start,i),dayStart=d.getTime(),dayEnd=addDays(d,1).getTime();
   const segments=visibleEvents().filter(e=>!e.start?.date&&dateStart(e).getTime()<dayEnd&&dateEnd(e).getTime()>dayStart).map(e=>({e,start:Math.max(0,(dateStart(e).getTime()-dayStart)/60000),end:Math.min(1440,(dateEnd(e).getTime()-dayStart)/60000)})).sort((a,b)=>a.start-b.start||b.end-a.end);
   const laneEnds=[];for(const seg of segments){let lane=laneEnds.findIndex(end=>end<=seg.start);if(lane<0){lane=laneEnds.length;laneEnds.push(0);}laneEnds[lane]=seg.end;seg.lane=lane;}
   const lanes=Math.max(1,laneEnds.length);
   const blocks=segments.map(({e,start:st,end,lane})=>`<button class="timeevent" data-open="${esc(e.id)}" data-calid="${esc(e._calendarId)}" style="top:${(st/60*54+2).toFixed(1)}px;height:${Math.max(20,(end-st)/60*54-3).toFixed(1)}px;left:calc(${(lane/lanes*100).toFixed(4)}% + 2px);width:calc(${(100/lanes).toFixed(4)}% - 4px);border-color:${eventColor(e)}" title="${esc(e.summary||'Event')}">${esc(e.summary||'Event')}<span>${esc(eventTime(e))}</span></button>`).join('');
   const current=isoDay(d)===isoDay(now)?`<div class="nowline" style="top:${minutes(now)/60*54}px"></div>`:'';
   return `<div class="timeday" data-day="${isoDay(d)}" aria-label="${dateLabel(d)}">${blocks}${current}</div>`;
 }).join('');
 return `${allDay.length?`<div class="panel" style="margin-bottom:13px"><div class="eyecap" style="margin-bottom:10px">ALL-DAY MOMENTS</div>${eventCards(allDay)}</div>`:''}<div class="help" style="margin-bottom:9px">Click an empty hour to create an event. Time shown in your device's timezone.</div><div class="timeline-scroll"><div class="timeboard" style="grid-template-columns:55px repeat(${days},minmax(${days===7?'110':'240'}px,1fr));min-width:${days===7?'825':'360'}px"><div class="timehead">Time</div>${headings}<div class="timeaxis">${hours}</div>${columns}</div></div>`;
}

function eventPayload(form,old=null){const f=new FormData(form),title=String(f.get('title')||'').trim(),calId=String(f.get('calendarId')||''),start=new Date(String(f.get('start'))),end=new Date(String(f.get('end'))),allDay=f.get('allDay')==='on';

function csvCell(x){return '"'+String(x??'').replaceAll('"','""')+'"';}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportCSV(){const rows=[['title','start','end','description','location','calendar'],...visibleEvents().map(e=>[e.summary,e.start?.dateTime||e.start?.date,e.end?.dateTime||e.end?.date,e.description||'',e.location||'',e._calendarName])];downloadFile('calendra-events-'+isoDay(TODAY())+'.csv','\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported successfully.','success');}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function icsStamp(d){return new Date(d).toISOString().replaceAll('-','').replaceAll(':','').replace('.000','').replace(/\.\d{3}/,'');}
function exportICS(){const events=visibleEvents(),lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Calendra//Calendar Export//EN','CALSCALE:GREGORIAN'];for(const e of events){lines.push('BEGIN:VEVENT','UID:'+icsEscape(e.id+'@calendra.export'),'DTSTAMP:'+icsStamp(new Date()),e.start?.date?'DTSTART;VALUE=DATE:'+e.start.date.replaceAll('-',''):'DTSTART:'+icsStamp(e.start.dateTime),e.end?.date?'DTEND;VALUE=DATE:'+e.end.date.replaceAll('-',''):'DTEND:'+icsStamp(e.end.dateTime),'SUMMARY:'+icsEscape(e.summary),'DESCRIPTION:'+icsEscape(e.description),'LOCATION:'+icsEscape(e.location),'END:VEVENT');}lines.push('END:VCALENDAR');const folded=lines.flatMap(line=>{const parts=[];while(line.length>73){parts.push(line.slice(0,73));line=' '+line.slice(73);}parts.push(line);return parts;});downloadFile('calendra-events-'+isoDay(TODAY())+'.ics',folded.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('ICS exported.','success');}
function csvParse(text){const data=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r'&&text[i+1]!=='\n')&&!quote){row.push(cell);if(row.some(x=>x.trim()))data.push(row);row=[];cell='';}else if(ch==='\r'&&!quote){}else{cell+=ch;}}row.push(cell);if(row.some(x=>x.trim()))data.push(row);const head=data.shift()?.map(s=>s.toLowerCase().trim().replace(/^\uFEFF/,''))||[];for(const required of ['title','start','end'])if(!head.includes(required))throw Error('CSV must contain title,start,end columns.');return data.map(row=>Object.fromEntries(head.map((h,i)=>[h,row[i]||'']))).filter(r=>r.title&&r.start&&r.end);}
async function importFile(input){const f=input.files?.[0];if(!f)return;if(f.size>2e6)return toast('CSV must be under 2 MB.','error');try{const parsed=csvParse(await f.text());if(parsed.length>150)throw Error('Import is limited to 150 events per batch.');const valid=parsed.filter(r=>!Number.isNaN(new Date(r.start).getTime())&&!Number.isNaN(new Date(r.end).getTime())&&new Date(r.end)>new Date(r.start));state.importRows=valid;const dup=valid.filter(r=>state.events.some(e=>e.summary===r.title&&Math.abs(dateStart(e)-new Date(r.start))<60000)).length;el('importPreview').innerHTML=`<span class="tag">${valid.length} valid rows · ${dup} potential duplicates</span><div style="max-height:240px;overflow:auto;margin:14px 0">${valid.slice(0,5).map(r=>`<div class="event-card"><div style="font-weight:800;font-size:11px">${esc(r.title)}<div class="help">${esc(r.start)} – ${esc(r.end)}</div></div></div>`).join('')}</div><button class="btn primary" id="confirmImport" ${!valid.length?'disabled':''}>Import valid events to default calendar</button><p class="help" id="importStatus">Duplicate title + exact start time will be skipped.</p>`;el('confirmImport').onclick=commitImport;}catch(e){toast(niceError(e),'error');}}
async function commitImport(){const b=el('confirmImport'),status=el('importStatus'),c=state.calendars.find(x=>x.id===state.settings.defaultCalendar)||state.calendars.find(x=>x.primary&&writable(x.id))||state.calendars.find(x=>writable(x.id));if(!c)return toast('No writable default calendar found.','error');if(!confirm(`Import up to ${state.importRows.length} events to ${c.summary}?`))return;b.disabled=true;let success=0,skipped=0,failed=0;const existing=new Set(state.events.map(e=>e.summary+'|'+dateStart(e).getTime()));for(const row of state.importRows){const key=row.title+'|'+new Date(row.start).getTime();if(existing.has(key)){skipped++;continue;}try{const start=new Date(row.start),end=new Date(row.end),tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Jakarta';await api(`/calendars/${encodeURIComponent(c.id)}/events`,{method:'POST',body:{summary:row.title.slice(0,200),description:(row.description||'').slice(0,4000),location:(row.location||'').slice(0,500),start:{dateTime:start.toISOString(),timeZone:tz},end:{dateTime:end.toISOString(),timeZone:tz}},query:{sendUpdates:'none'}});success++;existing.add(key);}catch(e){failed++;}status.textContent=`Imported ${success}, skipped ${skipped}, failed ${failed} of ${state.importRows.length}`;}b.disabled=false;toast(`Import finished: ${success} created, ${skipped} skipped, ${failed} failed.`,failed?'error':'success');await syncAll(false);}
async function disconnectCalendar(){if(state.token&&window.google?.accounts?.oauth2){try{window.google.accounts.oauth2.revoke(state.token,()=>{});}catch{}}state.token=null;state.expires=0;state.scope.clear();state.calendars=[];state.events=[];state.syncAt=0;state.fetchEpoch++;fetchAbort?.abort();setConnection();render();toast('Calendar disconnected. Google events remain unchanged.','success');}
async function refreshMeta(){await metaGuard(async()=>{const [n,a]=await Promise.all([metadata('notifications.list'),metadata('activity.list')]);state.notifications=n||[];state.activity=a||[];render();});}
async function saveProfile(form){await metaGuard(async()=>{const f=new FormData(form),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim(),photoURL=String(f.get('photoURL')||'').trim(),bio=String(f.get('bio')||'');if(!name)throw Error('Name is required.');if(photoURL&&!/^https:\/\//i.test(photoURL))throw Error('Photo URL must use HTTPS.');const u=state.user;if(email!==u.email){if(!confirm('Changing your Firebase email may require reauthentication. Continue?'))return;await verifyBeforeUpdateEmail(u,email,{url:new URL('index.html',location.href).href});toast('Email change verification sent. Click the link in the new inbox.','success');return;}
 await updateProfile(u,{displayName:name,photoURL:photoURL||null});state.profile=await metadata('user.profile.update',{name,photoURL,bio});profileHeader();render();toast('Profile updated successfully.','success');});}
async function saveSettings(form){await metaGuard(async()=>{const p=Object.fromEntries(new FormData(form));if(p.workStart>=p.workEnd)throw Error('Working hours are invalid.');try{new Intl.DateTimeFormat('en-US',{timeZone:p.timezone});}catch{throw Error('Invalid IANA timezone.');}p.defaultDuration=Number(p.defaultDuration);p.defaultReminder=Number(p.defaultReminder);state.settings=await metadata('user.settings.update',p);render();toast('Preferences saved to Google Sheets.','success');});}
async function resetPrefs(){await metaGuard(async()=>{if(!confirm('Reset all dashboard preferences to defaults?'))return;state.settings=await metadata('user.settings.update',{timezone:'Asia/Jakarta',workStart:'09:00',workEnd:'17:00',defaultDuration:60,defaultReminder:15,defaultCalendar:'primary',goals:''});render();toast('Preferences reset.','success');});}
async function doLogout(){try{await disconnectCalendar();state.bridge?.dispose();await signOut(state.auth);}finally{location.replace('index.html');}}
async function handleAction(action){switch(action){case'connect':return connectCalendar();case'sync':return syncAll(true);case'create':return openEventForm();case'meeting':return openEventForm(null,{kind:'meeting'});case'block':return openEventForm(null,{kind:'block'});case'today':state.selected=TODAY();return refreshAfterDate();case'prev':case'next':{const jump=action==='next'?1:-1,d=state.selected,view=state.calendarView;state.selected=view==='month'||view==='agenda'?new Date(d.getFullYear(),d.getMonth()+jump,Math.min(d.getDate(),28)):addDays(d,jump*(view==='week'?7:1));return refreshAfterDate();}case'closeModal':return hideModal();case'clearFilters':state.search='';state.filterCalendar='all';el('globalSearch').value='';return render();case'templateCreate':return openTemplateForm();case'newcal':return newCalendar();case'newCategory':return addCategory();case'csvExport':return exportCSV();case'icsExport':return exportICS();case'refreshMeta':return refreshMeta();case'disconnect':return disconnectCalendar();case'clearCache':state.cache.clear();return toast('Local cache cleared.','success');case'resetPrefs':return resetPrefs();case'logout':return doLogout();case'deleteMetadata':return metaGuard(async()=>{if(!confirm('Delete ALL your Calendra metadata in Google Sheets? Events in Google Calendar will not be touched.'))return;await metadata('user.profile.delete');state.profile=null;state.templates=[];state.categories=[];state.preferences=[];state.settings={timezone:'Asia/Jakarta',workStart:'09:00',workEnd:'17:00',defaultDuration:60,defaultReminder:15,defaultCalendar:'primary',goals:''};profileHeader();render();toast('Your Calendra metadata has been deleted.','success');});}}
document.addEventListener('click',async ev=>{
 const target=ev.target;
 const act=target.closest('[data-action]');if(act){ev.preventDefault();return handleAction(act.dataset.action);}
 const nav=target.closest('[data-nav]');if(nav){ev.preventDefault();return navigate(nav.dataset.nav);}
 const view=target.closest('[data-cview]');if(view){state.calendarView=view.dataset.cview;return render();}
 const event=target.closest('[data-open]');if(event){ev.stopPropagation();return showEvent(event.dataset.calid,event.dataset.open);}
 const eventBtn=target.closest('[data-event-action]');if(eventBtn)return eventAction(eventBtn.dataset.eventAction,eventBtn.dataset.calid,eventBtn.dataset.id);
 const tpl=target.closest('[data-use-template]');if(tpl){const t=state.templates.find(i=>i.id===tpl.dataset.useTemplate);return openEventForm(null,{template:t});}
 const tplEdit=target.closest('[data-edit-template]');if(tplEdit)return openTemplateForm(state.templates.find(t=>t.id===tplEdit.dataset.editTemplate));
 const tplDel=target.closest('[data-delete-template]');if(tplDel){const id=tplDel.dataset.deleteTemplate;if(!confirm('Delete this saved template permanently?'))return;return metaGuard(async()=>{await metadata('eventTemplates.delete',{id});state.templates=state.templates.filter(t=>t.id!==id);render();toast('Template deleted.','success');});}
 const categoryDelete=target.closest('[data-delete-category]');if(categoryDelete){if(!confirm('Delete this category? Events will not be removed.'))return;return metaGuard(async()=>{await metadata('categories.delete',{id:categoryDelete.dataset.deleteCategory});state.categories=state.categories.filter(c=>c.id!==categoryDelete.dataset.deleteCategory);render();toast('Category removed.','success');});}
 const calManage=target.closest('[data-calmanage]');if(calManage)return calendarManage(calManage.dataset.calmanage);
 const read=target.closest('[data-mark-read]');if(read)return metaGuard(async()=>{await metadata('notifications.markRead',{id:read.dataset.markRead});state.notifications=state.notifications.map(n=>n.id===read.dataset.markRead?{...n,read:true}:n);render();});
 const slot=target.closest('[data-slot]');if(slot)return openEventForm(null,{kind:'meeting',start:new Date(slot.dataset.slot)});
 const hourCell=target.closest('.timeday');if(hourCell){const rect=hourCell.getBoundingClientRect();const hour=Math.min(23,Math.max(0,Math.floor((ev.clientY-rect.top)/54)));return openEventForm(null,{start:new Date(`${hourCell.dataset.day}T${String(hour).padStart(2,'0')}:00:00`)});}
 const day=target.closest('[data-day]');if(day){state.selected=new Date(day.dataset.day+'T12:00:00');if(day.classList.contains('month-day')){state.calendarView='day';render();}else openEventForm(null,{start:new Date(day.dataset.day+'T09:00:00')});}
});
document.addEventListener('change',async ev=>{const t=ev.target;
 if(t.matches('[data-calendar-visible]')){const id=t.dataset.calendarVisible,visible=t.checked,cal=state.calendars.find(c=>c.id===id);const old=state.preferences.find(p=>p.calendarId===id);state.preferences=state.preferences.filter(p=>p.calendarId!==id).concat({...(old||{}),calendarId:id,visible});render();if(state.metadata==='connected'){try{await metadata('calendar.preferences.save',{calendarId:id,visible,color:cal?.backgroundColor});}catch(e){toast('Preference could not be saved: '+niceError(e),'error');}}else toast('Only changed in current session: metadata backend unavailable.','error');return;}
 if(t.id==='agendaPeriod'){const today=TODAY(),evs=visibleEvents().filter(e=>t.value==='all'||t.value==='today'&&isoDay(dateStart(e))===isoDay(today)||t.value==='upcoming'&&dateEnd(e)>today||t.value==='past'&&dateEnd(e)<=today);el('agendaResults').innerHTML=groupAgenda(evs)||empty();refreshIcons();}
 if(t.id==='filterCalendar'){state.filterCalendar=t.value;render();}
 if(t.id==='importFile')return importFile(t);
});
document.addEventListener('submit',async ev=>{const id=ev.target.id;if(!['quickForm','scheduleForm','profileForm','settingsForm'].includes(id))return;ev.preventDefault();const btn=ev.target.querySelector('[type=submit]');if(btn?.disabled)return;try{if(btn)btn.disabled=true;if(id==='quickForm')await createQuick(ev);if(id==='scheduleForm')await scheduling(ev);if(id==='profileForm')await saveProfile(ev.target);if(id==='settingsForm')await saveSettings(ev.target);}finally{if(btn?.isConnected)btn.disabled=false;}});
let searchTimer;document.addEventListener('input',ev=>{if(ev.target.id==='filterQuery'){const value=ev.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=value;const results=el('searchResults');if(results){results.innerHTML=eventCards(filterEvents());refreshIcons();}},190);}});
el('globalSearch').addEventListener('input',e=>{clearTimeout(searchTimer);const val=e.target.value;searchTimer=setTimeout(()=>{state.search=val;navigate('search');},210);});
el('quickBtn').onclick=()=>openEventForm();el('notiBtn').onclick=()=>{navigate('notifications');refreshMeta();};el('profileBtn').onclick=()=>navigate('profile');el('menuBtn').onclick=menu;el('overlay').onclick=closeSide;el('closeModal').onclick=hideModal;el('modalLayer').onclick=e=>{if(e.target===el('modalLayer'))hideModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!el('modalLayer').hidden)hideModal();else closeSide();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();el('globalSearch').focus();}if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&el('modalLayer').hidden){e.preventDefault();openEventForm();}if(e.key==='Tab'&&!el('modalLayer').hidden){const focusable=[...el('modalLayer').querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>x.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
window.addEventListener('online',()=>{toast('Back online. You may sync again.','success');render();});window.addEventListener('offline',()=>render());
try{if(!C.configured())throw Error('Konfigurasi Firebase belum lengkap. Perbarui config.js terlebih dahulu.');state.auth=getAuth(getApps().length?getApp():initializeApp(C.CONFIG.FIREBASE_CONFIG));onAuthStateChanged(state.auth,async user=>{if(!user){location.replace('index.html');return;}if(!user.emailVerified){location.replace('verify.html');return;}state.user=user;gate(false);profileHeader();renderNav();render();initMetadata();state.syncTimer=setInterval(()=>{if(state.token&&document.visibilityState==='visible'&&Date.now()<state.expires&&!state.loadPending)syncAll(false);},300000);});}catch(e){el('authGate').innerHTML=`<div class="symbol">!</div><b>Configuration required</b><p style="max-width:360px;text-align:center">${esc(niceError(e))}</p><a class="btn" href="index.html">Back to sign in</a>`;}
</script></body></html>
